extends: relaxed

rules:
  line-length: disable
  indentation:
    level: error
    spaces: consistent
    indent-sequences: consistent

# Chart templates are Go templates, not YAML, until helm renders them; ct and
# helm lint check them. Dependency charts are fetched, not ours.
ignore: |
  **/node_modules/
  charts/*/charts/
  charts/*/templates/
  dist/
