config:
  # Default state for all rules
  default: true

  # MD013: Disable line length rule
  MD013: false
  MD024: false
  MD038: false
  # MD060: table pipe spacing; the chart READMEs use compact tables.
  MD060: false

# Every Markdown file in the repository: the README and the chart READMEs
# helm packages with each chart.
globs:
  - "**/*.md"

ignores:
  - "**/node_modules/**"
  - "dist/**"
