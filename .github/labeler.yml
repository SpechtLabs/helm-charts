# One label per chart
static-pages:
  - changed-files:
      - any-glob-to-any-file:
          - "charts/static-pages/**"

tka:
  - changed-files:
      - any-glob-to-any-file:
          - "charts/tka/**"

urlshortener:
  - changed-files:
      - any-glob-to-any-file:
          - "charts/urlshortener/**"

# Documentation
documentation:
  - changed-files:
      - any-glob-to-any-file:
          - "**/*.md"

# Build, release, and CI plumbing
build:
  - changed-files:
      - any-glob-to-any-file:
          - ".github/**"
          - ".mise.toml"
          - "ct.yaml"
          - ".pre-commit-config.yaml"
          - ".markdownlint-cli2.yaml"
          - ".yamllint.yaml"
          - ".editorconfig"
          - "renovate.json"

# Add 'enhancement' to any PR whose head branch starts with `feat` or `feature`
enhancement:
  - head-branch:
      - "^feat"
      - "^feature"

# Add 'bug' to any PR whose head branch starts with `fix` or `bug`
bug:
  - head-branch:
      - "^fix"
      - "^bug"
