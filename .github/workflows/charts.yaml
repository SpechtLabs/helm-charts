name: Charts

# The charts: ct lint (helm lint, which renders every template, and the chart
# version bump), yamllint, actionlint, markdownlint, and ct install of the
# changed charts into a kind cluster. ci.yaml calls it for pull requests,
# release.yaml gates every chart release on it, and it runs on its own from
# the Actions tab.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Each job installs the tools listed below with mise-action's install_args.
  # Without this, `mise run` installs every tool in .mise.toml first,
  # pre-commit and pinact included, which no job runs.
  MISE_TASK_RUN_AUTO_INSTALL: "false"
  # mise itself, pinned. Unpinned, mise-action picks the newest release and
  # leaves it out of its cache key, so every new mise release finds an older
  # binary in the restored cache, warns that it failed integrity verification
  # and downloads it again.
  # renovate: datasource=github-releases depName=jdx/mise extractVersion=^v(?<version>.+)$
  MISE_VERSION: 2026.10.6
  # Every tool a job here runs, installed in every job. mise-action keys its
  # cache on install_args, so one list means one cache: main's runs save it
  # and every pull request restores it.
  MISE_TOOLS: helm aqua:helm/chart-testing kind kubectl yamllint actionlint shellcheck node markdownlint-cli2

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      # ct compares the pull request with main, so it needs main's history.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: ${{ env.MISE_VERSION }}
          install_args: ${{ env.MISE_TOOLS }}

      # The matcher turns actionlint's output into annotations on the PR diff.
      # shellcheck is installed above, so the `run:` scripts are checked too.
      - name: Lint charts, YAML, workflows and Markdown
        run: |
          echo "::add-matcher::.github/actionlint-matcher.json"
          mise run lint

      # chart-releaser publishes a chart whenever its version changes, and
      # skips it when the version is already released, so a chart change
      # without a version bump would never reach the chart repository.
      - name: Check changed charts bump their version
        run: mise run chart-lint-changed

  install:
    name: Install
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: ${{ env.MISE_VERSION }}
          install_args: ${{ env.MISE_TOOLS }}

      # The same exclusions as the chart-install task; .mise.toml explains
      # them.
      - name: List the changed charts ct installs
        id: changed
        run: |
          set -euo pipefail
          changed="$(ct list-changed --config ct.yaml --excluded-charts tka,urlshortener)"
          echo "${changed:-no installable chart changed}"
          if [ -n "${changed}" ]; then
            echo "changed=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Create kind cluster
        if: steps.changed.outputs.changed == 'true'
        run: kind create cluster --wait 120s

      - name: Install the changed charts
        if: steps.changed.outputs.changed == 'true'
        run: mise run chart-install
