name: CI

# Everything a pull request runs. charts.yaml is a workflow of its own, which
# release.yaml calls to gate every chart release and which runs on its own
# from the Actions tab.
on:
  # Skip pull requests that only touch the top-level documentation. The filter
  # excludes rather than lists, so a new directory or config file runs CI by
  # default. The chart READMEs ship inside the chart packages, so a change to
  # one still runs CI (and needs a chart version bump). No check is required
  # by the rulesets, which is what makes a workflow-level filter safe: a
  # skipped required check would block the merge.
  pull_request:
    paths:
      - "**"
      - "!README.md"
      - "!LICENSE"
      - "!CODEOWNERS"
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request supersedes its run in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  charts:
    name: Charts
    uses: ./.github/workflows/charts.yaml
