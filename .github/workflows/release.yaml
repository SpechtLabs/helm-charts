name: Release Charts

# chart-releaser packages every chart whose version changed since the last
# release tag, creates a GitHub release (<chart>-<version>) for each, and adds
# it to the index on the gh-pages branch, which charts.specht-labs.de serves.
# A chart version that is released already is skipped (skip_existing), so a
# rerun never fails on it.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  # mise itself, pinned; charts.yaml explains why.
  # renovate: datasource=github-releases depName=jdx/mise extractVersion=^v(?<version>.+)$
  MISE_VERSION: 2026.10.4

# Never cancel a release half-way: that can leave a release published with no
# index entry. Every run pushes to gh-pages, so runs queue rather than race;
# a queued run that a newer push replaces loses nothing, because the newer
# run releases everything changed since the last tag.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  # The gate: the same lint and install checks a pull request runs.
  charts:
    name: Charts
    uses: ./.github/workflows/charts.yaml

  release:
    name: Release changed charts
    runs-on: ubuntu-latest
    needs:
      - charts
    permissions:
      contents: write
    steps:
      # Renovate automerges in quick succession. A run whose commit is no
      # longer main's tip leaves the release to the newer run, which releases
      # this commit's charts too.
      - name: Refuse to act unless this run's head is still main's tip
        id: still-current
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tip="$(gh api "repos/${{ github.repository }}/commits/main" --jq .sha)"
          if [ "$tip" = "${{ github.sha }}" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "::notice::main has moved to $tip since this run started at ${{ github.sha }}; leaving the release to that run."
          fi

      # chart-releaser finds the changed charts by diffing against the last
      # tag, so it needs the history and the tags.
      - name: Checkout repository
        if: steps.still-current.outputs.current == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Configure Git
        if: steps.still-current.outputs.current == 'true'
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Set up mise
        if: steps.still-current.outputs.current == 'true'
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: ${{ env.MISE_VERSION }}
          install_args: helm aqua:helm/chart-releaser

      # The action downloads its own cr into install_dir unless that directory
      # exists already, so pointing it at mise's install runs the cr pinned in
      # .mise.toml.
      - name: Locate the pinned chart-releaser
        id: cr
        if: steps.still-current.outputs.current == 'true'
        run: echo "dir=$(dirname "$(mise which cr)")" >> "$GITHUB_OUTPUT"

      - name: Run chart-releaser
        if: steps.still-current.outputs.current == 'true'
        uses: helm/chart-releaser-action@cae68fefc6b5f367a0275617c9f83181ba54714f # v1.7.0
        with:
          install_dir: ${{ steps.cr.outputs.dir }}
          skip_existing: true
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
